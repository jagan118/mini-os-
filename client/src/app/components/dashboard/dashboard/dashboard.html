<!-- dashboard.component.html -->
<div class="dashboard">
  @if (monitorService.isDemoMode) {
    <aside class="demo-notice">
      <strong>DEMO MODE</strong>
      <span>Sample data only. This app runs on Vercel and cannot access your device's CPU, memory, or processes.</span>
    </aside>
  }
  @if (cpu()) {
    <app-cpu-monitor [data]="cpu()!" />
  }
  @if (memory()) {
    <app-memory-monitor [data]="memory()!" />
  }
  @if (processes()) {
    <app-process-monitor
      [data]="processes()!"
      [demoMode]="monitorService.isDemoMode"
      (killProcess)="killProcess($event)"
      (search)="searchProcess($event)"
    />
  }
</div>
